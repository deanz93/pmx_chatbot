<!DOCTYPE html>
<title>PMX Twin — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#111; --surface:#1c1c1c; --surface-2:#272727; --border:#2a2a2a; --text:#f0f0f0; --text-2:#888; --text-3:#444; --accent:#d4a017; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; --mono:'SF Mono','Cascadia Code',Consolas,monospace; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased; }

/* Login */
#login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px; }
#login h1 { font-size:18px; font-weight:600; margin-bottom:4px; }
#login h1 span { color:var(--accent); }
#login p { font-size:13px; color:var(--text-2); margin-bottom:8px; }
#pwd-input { width:260px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font:14px var(--font); outline:none; }
#pwd-input:focus { border-color:var(--accent); }
#login-btn { width:260px; padding:10px; background:var(--accent); border:none; border-radius:8px; color:#111; font:600 14px var(--font); cursor:pointer; }
#login-btn:hover { opacity:.85; }
#login-err { font-size:12px; color:#e57373; display:none; }

/* Dashboard */
#dashboard { display:none; flex-direction:column; height:100vh; }
.top { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:52px; border-bottom:1px solid var(--border); flex-shrink:0; }
.top-title { font-size:15px; font-weight:600; }
.top-title span { color:var(--accent); }
.top-right { display:flex; gap:8px; align-items:center; }
.stat { font-size:12px; color:var(--text-2); font-family:var(--mono); }
.btn { padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--text-2); font:12px var(--font); cursor:pointer; transition:all .12s; }
.btn:hover { background:var(--surface-2); color:var(--text); }
.btn.danger:hover { border-color:#e57373; color:#e57373; }
.btn.logout { color:var(--text-3); }

/* Table */
.table-wrap { flex:1; overflow:auto; padding:0; }
table { width:100%; border-collapse:collapse; }
thead { position:sticky; top:0; background:var(--surface); z-index:1; }
th { padding:10px 16px; text-align:left; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); border-bottom:1px solid var(--border); }
td { padding:10px 16px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface); }
.td-ts { font-size:11.5px; color:var(--text-2); font-family:var(--mono); white-space:nowrap; width:150px; }
.td-prompt { font-size:13.5px; line-height:1.5; word-break:break-word; }
.td-num { font-size:11px; color:var(--text-3); font-family:var(--mono); width:40px; text-align:right; }

.empty { padding:48px; text-align:center; color:var(--text-3); font-size:13px; }
.loading { padding:48px; text-align:center; color:var(--text-3); font-size:13px; }
</style>

<!-- Login screen -->
<div id="login">
  <h1>PMX <span>Twin</span> Admin</h1>
  <p>Masukkan kata laluan admin untuk teruskan.</p>
  <input id="pwd-input" type="password" placeholder="Kata laluan admin…" autocomplete="current-password">
  <button id="login-btn">Masuk</button>
  <span id="login-err">Kata laluan salah. Cuba lagi.</span>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="top">
    <div class="top-title">PMX <span>Twin</span> — Log Pertanyaan</div>
    <div class="top-right">
      <span class="stat" id="stat"></span>
      <button class="btn" onclick="loadLogs()">Muat Semula</button>
      <button class="btn danger" onclick="clearAll()">Padam Semua</button>
      <button class="btn logout" onclick="logout()">Log Keluar</button>
    </div>
  </div>
  <div class="table-wrap">
    <div class="loading" id="tbl-wrap">Memuatkan…</div>
  </div>
</div>

<script>
let adminKey = '';

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmt(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  return d.toLocaleDateString('ms-MY') + ' ' + d.toLocaleTimeString('ms-MY', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function loadLogs() {
  const wrap = document.getElementById('tbl-wrap');
  wrap.innerHTML = '<div class="loading">Memuatkan…</div>';
  try {
    const res = await fetch('/api/logs', { headers: { 'x-admin-key': adminKey } });
    if (res.status === 401) { logout(); return; }
    const { logs, total } = await res.json();
    document.getElementById('stat').textContent = `${total} pertanyaan`;
    if (!logs.length) {
      wrap.innerHTML = '<div class="empty">Tiada log lagi.</div>';
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr><th>#</th><th>Masa</th><th>Pertanyaan</th></tr></thead>
      <tbody>${logs.map((l,i)=>`<tr>
        <td class="td-num">${i+1}</td>
        <td class="td-ts">${fmt(l.ts)}</td>
        <td class="td-prompt">${esc(l.prompt)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  } catch {
    wrap.innerHTML = '<div class="empty">Gagal memuatkan log.</div>';
  }
}

async function clearAll() {
  if (!confirm('Padam semua log? Tindakan ini tidak boleh diundur.')) return;
  await fetch('/api/logs', { method:'DELETE', headers:{'x-admin-key':adminKey} });
  loadLogs();
}

function logout() {
  adminKey = '';
  sessionStorage.removeItem('pmx_admin_key');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}

async function tryLogin(key) {
  const res = await fetch('/api/logs', { headers: { 'x-admin-key': key } });
  return res.status !== 401;
}

document.getElementById('login-btn').onclick = async () => {
  const key = document.getElementById('pwd-input').value.trim();
  if (!key) return;
  const ok = await tryLogin(key);
  if (ok) {
    adminKey = key;
    sessionStorage.setItem('pmx_admin_key', key);
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadLogs();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
};

document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// Auto-login from session
const saved = sessionStorage.getItem('pmx_admin_key');
if (saved) {
  tryLogin(saved).then(ok => {
    if (ok) {
      adminKey = saved;
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadLogs();
    }
  });
}
</script>
